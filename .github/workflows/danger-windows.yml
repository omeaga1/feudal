name: Danger windows

# Samples recently finished ranked 1v1 games from AoE4 World and commits the
# updated win-rate-by-game-length table. The app reads it from main.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: danger-windows
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-danger-windows.mjs
      - name: Commit if changed
        run: |
          git config user.name "feudal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/danger-windows.json
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "Update danger windows [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
