name: Build watch

# Flags game plans that predate the current patch and finds fresh guides on
# aoe4guides.com. Commits the report the app reads, and opens one issue per
# new game build so the plans get re-checked.
on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: build-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/watch-build-orders.mjs
        env:
          ISSUE_BODY: ${{ runner.temp }}/build-watch-issue.md
      - name: Commit if changed
        run: |
          git config user.name "feudal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/build-watch.json
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "Update build watch [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Open an issue for a new patch
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ runner.temp }}/build-watch-issue.md
        run: |
          [ -f "$BODY" ] || { echo "All plans are current."; exit 0; }
          build=$(node -p "require('./src/data/generated/build-watch.json').latestBuild")
          title="Patch $build: re-check game plans"
          if gh issue list --state all --search "\"$title\" in:title" --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "Issue already exists."
            exit 0
          fi
          gh issue create --title "$title" --body-file "$BODY"
