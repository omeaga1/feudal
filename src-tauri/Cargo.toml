[package]
name = "feudal"
version = "0.7.1"
description = "A free Age of Empires IV companion"
authors = ["omeaga1"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "feudal_lib"
# Desktop only needs the rlib. The staticlib and cdylib are for mobile, and
# each one ran its own full LTO pass, tripling release link time.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["native-certs"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# No cross-crate LTO and default parallel codegen. Fat LTO with one codegen
# unit made the final link take nearly 4 minutes on CI for a slightly smaller
# exe, and the NSIS installer compresses it anyway.
[profile.release]
opt-level = 3
panic = "abort"
strip = true
